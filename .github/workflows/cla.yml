# CLA Assistant Lite: asks every pull request author to sign CLA.md once, by commenting the sentence below, and keeps
# the signatures in signatures/version1/cla.json on the cla-signatures branch. A new CLA version gets a new
# signatures file (version2, ...), so everyone accepts it again.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # to write the signatures file
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        # pull_request_target runs this workflow as it is on main and never checks out the pull request's code.
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the Job Hunt OS CLA version 1.0 and I hereby sign it'))
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/triump0870/AI-Job-Hunt/blob/main/CLA.md
          branch: cla-signatures
          allowlist: triump0870,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Job Hunt OS CLA version 1.0 and I hereby sign it
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read the
            [Job Hunt OS Contributor License Agreement](https://github.com/triump0870/AI-Job-Hunt/blob/main/CLA.md)
            and sign it by posting the comment below on this pull request, exactly as written. You sign once per
            GitHub account; it covers your future pull requests. If your employer has rights in this work, say so here
            instead of signing, and a maintainer will arrange its permission privately.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
